<div class="tm-dropdown" [class.tm-dropdown--compact]="compact" (tmClickOutside)="close()">
  <button
    type="button"
    class="tm-dropdown-trigger"
    [class.tm-dropdown-trigger--open]="open()"
    [disabled]="disabled"
    aria-haspopup="listbox"
    [attr.aria-expanded]="open()"
    [attr.aria-controls]="panelId"
    (click)="toggle()"
  >
    <span class="tm-dropdown-trigger-label" [class.is-placeholder]="!selectedLabel">
      {{ selectedLabel ?? placeholder }}
    </span>
    <i class="bi bi-chevron-down tm-dropdown-chevron"></i>
  </button>

  <div
    #panel
    popover="manual"
    class="tm-dropdown-panel"
    role="listbox"
    [id]="panelId"
    [ngStyle]="panelStyle()"
  >
    @for (option of options; track option.value) {
    <button
      type="button"
      class="tm-dropdown-option"
      [class.tm-dropdown-option--selected]="option.value === value"
      [disabled]="option.disabled"
      role="option"
      [attr.aria-selected]="option.value === value"
      (click)="select(option)"
    >
      {{ option.label }}
    </button>
    }
  </div>
</div>
