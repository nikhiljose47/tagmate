@if (!network.isOnline()) {
  <div class="fixed top-0 left-0 right-0 z-[10001] bg-red-500 text-white text-center py-1 text-sm font-semibold">
    You are currently offline.
  </div>
}

@if (showNav()) {
  <app-nav />
}

<div class="main-container" [class.with-nav]="showNav()">
  @if (showTopbar()) {
    <app-topbar />
  }

  <main class="workspace-router" [class.authenticated]="showNav()">
    <router-outlet></router-outlet>
  </main>
</div>

@if (toast.message(); as message) {
  <div
    class="app-toast"
    role="status"
    aria-live="polite"
  >
    <span class="app-toast-icon" aria-hidden="true">
      <i class="bi" [ngClass]="toastIcon(message.tone)"></i>
    </span>
    <span class="app-toast-text">
      {{ message.text }}
    </span>
    <button
      type="button"
      class="app-toast-close"
      aria-label="Dismiss notification"
      (click)="toast.dismiss()"
    >
      <i class="bi bi-x-lg" aria-hidden="true"></i>
    </button>
  </div>
}

<app-confirm-dialog />
<app-notification-drawer />
