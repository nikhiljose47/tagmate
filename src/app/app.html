@if (!network.isOnline()) {
<div
  class="fixed top-0 left-0 right-0 z-[10001] bg-red-500 text-white text-center py-1 text-sm font-semibold"
>
  You are currently offline.
</div>
} @if (showTopbar()) {
<app-topbar />
} @if (showNav()) {
<app-nav />
}

<div class="main-container" [class.with-topbar]="showTopbar()" [class.with-nav]="showNav()">
  <main class="workspace-router" [class.authenticated]="showNav()">
    <router-outlet></router-outlet>
  </main>
</div>

@if (appUpdate.updateReady()) {
<aside
  class="app-update"
  [class.with-nav]="showNav()"
  role="alert"
  aria-live="assertive"
  aria-label="App error — reload required"
>
  <span class="app-update-icon" aria-hidden="true">
    <i class="bi bi-exclamation-triangle-fill"></i>
  </span>
  <span class="app-update-copy">
    <strong>Something went wrong</strong>
    <span>Please reload to restore the app.</span>
  </span>
  <button
    type="button"
    class="app-update-action"
    [disabled]="appUpdate.reloading()"
    (click)="appUpdate.reload()"
  >
    {{ appUpdate.reloading() ? 'Reloading...' : 'Reload' }}
  </button>
  <button
    type="button"
    class="app-update-dismiss"
    aria-label="Dismiss notice"
    (click)="appUpdate.dismiss()"
  >
    <i class="bi bi-x-lg" aria-hidden="true"></i>
  </button>
</aside>
} @if (toast.message(); as message) {
<div class="app-toast" role="status" aria-live="polite">
  <span class="app-toast-icon" aria-hidden="true">
    <i class="bi" [ngClass]="toastIcon(message.tone)"></i>
  </span>
  <span class="app-toast-text"> {{ message.text }} </span>
  <button
    type="button"
    class="app-toast-close"
    aria-label="Dismiss notification"
    (click)="toast.dismiss()"
  >
    <i class="bi bi-x-lg" aria-hidden="true"></i>
  </button>
</div>
}

<app-confirm-dialog />
<app-notification-drawer />
